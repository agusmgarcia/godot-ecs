name: Release
run-name: Release ${{ github.ref_name }}
permissions: write-all

on:
  push:
    tags:
      - "ECS.*@v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref_name }}

jobs:
  continuous-integration:
    name: Continuous integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --configuration Release --no-build --verbosity normal

  continuous-delivery:
    name: Continuous delivery
    needs: continuous-integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Parse tag
        id: tag
        run: |
          PACKAGE_NAME="${GITHUB_REF_NAME%@*}"
          PACKAGE_VERSION="${GITHUB_REF_NAME#*@v}"
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

      - name: Create NuGet package
        run: >
          dotnet pack ${{ steps.tag.outputs.name }}/${{ steps.tag.outputs.name }}.csproj
          --configuration Release
          --output ./nupkgs
          /p:Version=${{ steps.tag.outputs.version }}

      - name: Authenticate with GitHub Packages
        run: >
          dotnet nuget add source 
          "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" 
          --name "GitHubPackages" 
          --username "${{ github.repository_owner }}" 
          --password "${{ secrets.GITHUB_TOKEN }}" 
          --store-password-in-clear-text-plugin-authorization

      - name: Push package to GitHub Packages
        run: dotnet nuget push "./nupkgs/*.nupkg" --source "GitHubPackages"
