name: Release
run-name: Release ${{ github.ref_name }}
permissions: write-all

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref_name }}

jobs:
  continuous-integration:
    name: Continuous integration
    outputs:
      artifact-id: ${{ steps.upload-build-outputs.outputs.artifact-id }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Create output folder
        run: mkdir output && cp -R ECS output/ECS && rm -rf output/ECS/bin output/ECS/obj output/ECS/ECS.csproj

      - name: Upload build outputs
        id: upload-build-outputs
        uses: actions/upload-artifact@v7
        with:
          name: output
          if-no-files-found: error
          include-hidden-files: false
          path: ./output
          retention-days: 1

  continuous-delivery:
    name: Continuous delivery
    needs: continuous-integration
    runs-on: ubuntu-latest
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.continuous-integration.outputs.artifact-id }}
          path: /tmp/output

      - name: Package release artifact
        run: cd /tmp/output && zip -r /tmp/ECS.zip ECS/

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog file
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log ${{ github.ref_name }} --oneline --no-merges)
          else
            COMMITS=$(git log ${PREVIOUS_TAG}..${{ github.ref_name }} --oneline --no-merges)
          fi
          echo "$COMMITS" | sed 's/^/- /' > /tmp/CHANGELOG.md

      - uses: ncipollo/release-action@v1
        with:
          artifactErrorsFailBuild: true
          artifacts: /tmp/ECS.zip
          bodyFile: /tmp/CHANGELOG.md
          immutableCreate: true
          name: Release ${{ github.ref_name }}
