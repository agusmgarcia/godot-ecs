name: Release
run-name: Release ${{ github.ref_name }}
permissions: write-all

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref_name }}

jobs:
  continuous-integration:
    name: Continuous integration
    outputs:
      artifact-id: ${{ steps.upload-build-outputs.outputs.artifact-id }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Create 'addons' folder
        run: mkdir addons && cp -R ECS addons/ECS && rm -rf addons/ECS/bin addons/ECS/obj addons/ECS/ECS.csproj

      - name: Upload build outputs
        id: upload-build-outputs
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          include-hidden-files: false
          path: ./addons
          retention-days: 1

  continuous-delivery:
    name: Continuous delivery
    needs: continuous-integration
    runs-on: ubuntu-latest

    steps:
      - uses: ncipollo/release-action@v1
        with:
          artifactErrorsFailBuild: true
          artifacts: ${{ needs.continuous-integration.outputs.artifact-id }}
          immutableCreate: true
          name: Release ${{ github.ref_name }}
